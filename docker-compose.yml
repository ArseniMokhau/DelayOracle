services:
  api:
    build: ./backend
    ports:
      - "5000:8080"
    environment:
      # Development mode turns on Swagger UI at http://localhost:5000/swagger
      ASPNETCORE_ENVIRONMENT: Development

  worker:
    build: ./ai-worker
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
