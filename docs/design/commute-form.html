<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DelayOracle: new commute form (design mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#3B1FA8}a:hover{color:#150B40}
</style>
</head>
<body>
<!-- Static design mock with sample data. Not part of the application. -->
<div style="container-type: inline-size; background: #F1F2F8; color: #150B40; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(16px, 4cqi, 48px); display: flex; flex-direction: column; gap: clamp(16px, 2cqi, 24px)">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 8px">
<div style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="#2A1578"/><circle cx="20" cy="20" r="10" fill="none" stroke="#7CF2B4" stroke-width="4"/><path d="M20 14v6l4 3" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">DelayOracle</span>
</div>
<nav aria-label="Sections" style="display: flex; gap: 4px; padding: 4px; background: #FFFFFF; border-radius: 999px">
<button type="button" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: transparent; color: #4A4270; font: 600 15px 'Inter', sans-serif; cursor: pointer">Departures</button>
<button type="button" aria-current="page" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #2A1578; color: #FFFFFF; font: 600 15px 'Inter', sans-serif; cursor: pointer">My commutes</button>
</nav>
</header>

<div style="display: flex; flex-wrap: wrap; gap: clamp(16px, 2cqi, 24px); align-items: stretch">

<section aria-label="About commutes" style="flex: 1 1 300px; box-sizing: border-box; padding: clamp(24px, 3.4cqi, 44px); background: #FFD84D; border-radius: 36px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(40px, 5.4cqi, 68px); line-height: 0.98; letter-spacing: -0.03em">New commute</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5">Tell us the stop and how long the walk is. We will tell you when to leave the house.</p>
</section>

<form style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; padding: clamp(22px, 3.4cqi, 44px); background: #FFFFFF; border-radius: 36px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-name" style="font-weight: 600; font-size: 15px">Name</label>
<input id="f-name" type="text" value="Morning to work" maxlength="60" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 18px; background: #F1F2F8; border: 2px solid #6F66A0; border-radius: 16px; color: #150B40; font: 500 17px 'Inter', sans-serif">
<span style="font-size: 14px; color: #4A4270">Up to 60 characters</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="f-stop" style="font-weight: 600; font-size: 15px">Stop</label>
<input id="f-stop" type="search" value="Brama Wyżynna" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 18px; background: #F1F2F8; border: 2px solid #6F66A0; border-radius: 16px; color: #150B40; font: 500 17px 'Inter', sans-serif">
<span style="font-size: 14px; color: #4A4270">Start typing and pick a stop from the list</span>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px">
<label for="f-line" style="font-weight: 600; font-size: 15px">Line <span style="font-weight: 400; color: #4A4270">(optional)</span></label>
<input id="f-line" type="text" value="154" maxlength="8" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 18px; background: #F1F2F8; border: 2px solid #6F66A0; border-radius: 16px; color: #150B40; font: 500 17px 'Inter', sans-serif">
<span style="font-size: 14px; color: #4A4270">Leave empty for any line</span>
</div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px">
<label for="f-walk" style="font-weight: 600; font-size: 15px">Walk to the stop, minutes</label>
<input id="f-walk" type="number" value="75" min="0" max="60" aria-invalid="true" aria-describedby="f-walk-error" style="min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 18px; background: #FFF1EC; border: 2px solid #B3261E; border-radius: 16px; color: #150B40; font: 500 17px 'Inter', sans-serif">
<span id="f-walk-error" role="alert" style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: #B3261E"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="none" stroke="#B3261E" stroke-width="2"/><path d="M9 5v5M9 13v.5" stroke="#B3261E" stroke-width="2" stroke-linecap="round"/></svg>Enter a walk between 0 and 60 minutes</span>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px">
<button type="submit" style="min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #2A1578; color: #FFFFFF; font: 600 17px 'Inter', sans-serif; cursor: pointer">Save commute</button>
<button type="button" style="min-height: 52px; padding: 0 28px; border: 2px solid #6F66A0; border-radius: 999px; background: #FFFFFF; color: #150B40; font: 600 17px 'Inter', sans-serif; cursor: pointer">Cancel</button>
</div>
</form>

</div>
</div>
</div>
</body>
</html>
